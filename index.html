<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Guru - SMPN 1 Ngunut</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; } }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200">

    <div id="app" class="h-full w-full overflow-auto">
        <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>
        
        <div id="page-login" class="h-full w-full flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 fade-in">
                <h1 class="text-xl font-bold text-center mb-6">SMP Negeri 1 Ngunut</h1>
                <div id="login-form">
                    <input id="login-email" type="email" class="w-full mb-4 px-4 py-2.5 rounded-lg border dark:bg-slate-700 dark:border-slate-600 text-sm focus:outline-none focus:border-blue-500" placeholder="Email" value="admin@gmail.com">
                    <input id="login-pass" type="password" class="w-full mb-4 px-4 py-2.5 rounded-lg border dark:bg-slate-700 dark:border-slate-600 text-sm focus:outline-none focus:border-blue-500" placeholder="Password" value="admin123">
                    <button onclick="doLogin()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm transition">Masuk</button>
                </div>
            </div>
        </div>

        <div id="page-app" class="hidden h-full w-full flex">
            <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r dark:border-slate-700 flex flex-col h-full shrink-0">
                <div class="p-4 border-b dark:border-slate-700">
                    <h2 class="font-bold text-slate-800 dark:text-white">SMPN 1 Ngunut</h2>
                    <p class="text-xs text-slate-400 mt-0.5" id="user-role-info">Administrator</p>
                </div>
                <nav class="flex-1 p-3 space-y-1" id="sidebar-nav"></nav>
            </aside>
            
            <main class="flex-1 overflow-y-auto h-full p-6" id="main-content"></main>
        </div>
    </div>

    <script>
        // --- SDK & STATE ---
        let allData = [];
        let currentUser = null;
        let currentPage = 'dashboard';

        function createLocalDataSdk() {
            const storageKey = 'sistem_admin_guru_v2';
            return {
                async init(handler) { allData = JSON.parse(localStorage.getItem(storageKey) || '[]'); handler.onDataChanged(allData); return { isOk: true }; },
                async create(r) { r.__backendId = 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); allData.push(r); localStorage.setItem(storageKey, JSON.stringify(allData)); return { isOk: true }; },
                async update(r) { const idx = allData.findIndex(i => i.__backendId === r.__backendId); if(idx !== -1) { allData[idx] = r; localStorage.setItem(storageKey, JSON.stringify(allData)); } return { isOk: true }; },
                async delete(r) { allData = allData.filter(i => i.__backendId !== r.__backendId); localStorage.setItem(storageKey, JSON.stringify(allData)); return { isOk: true }; }
            };
        }

        // --- VALIDASI PRIMARY KEY ---
        function isDuplicateStudent(nis, nisn, excludeId = null) {
            if (!nis && !nisn) return false;
            return allData.filter(d => d.type === 'student').some(s => {
                if (excludeId && s.__backendId === excludeId) return false;
                const sameNis = nis && String(s.nis || '').trim() === String(nis).trim();
                const sameNisn = nisn && String(s.nisn || '').trim() === String(nisn).trim();
                return sameNis || sameNisn;
            });
        }

        // --- MODAL POPUP HELPER ---
        function openModal(title, inputs, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/40 flex items-center justify-center z-50 fade-in';
            overlay.innerHTML = `<div class="bg-white dark:bg-slate-800 rounded-xl p-6 w-full max-w-md mx-4 shadow-xl border dark:border-slate-700">
                <p class="font-bold text-lg mb-4 text-slate-900 dark:text-white">${title}</p>
                <div class="mb-4 space-y-4">${inputs}</div>
                <div class="flex gap-2 justify-end">
                    <button onclick="this.parentElement.parentElement.parentElement.remove()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm font-medium transition">Batal</button>
                    <button id="conf-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">Simpan</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#conf-btn').onclick = () => { onConfirm(overlay); };
        }

        // --- MANAJEMEN MODAL DAN INPUT MANUAL ---
        function showAddStudentModal() {
            const inputs = `
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor Induk / Induk</label>
                    <input id="inp-nis" type="text" class="w-full px-3 py-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="Contoh: 20727">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">NISN</label>
                    <input id="inp-nisn" type="text" class="w-full px-3 py-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="Contoh: 0114806114">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Siswa</label>
                    <input id="inp-sname" type="text" class="w-full px-3 py-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="Nama Lengkap">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Kelas</label>
                    <input id="inp-sclass" type="text" class="w-full px-3 py-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="Contoh: 8A">
                </div>
            `;
            openModal('Tambah Data Siswa', inputs, async (modal) => {
                const nis = document.getElementById('inp-nis').value.trim();
                const nisn = document.getElementById('inp-nisn').value.trim();
                const name = document.getElementById('inp-sname').value.trim();
                const cls = document.getElementById('inp-sclass').value.trim();
                
                if (!nis || !name || !cls) return toast('NIS, Nama, dan Kelas wajib diisi!', 'error');
                if (isDuplicateStudent(nis, nisn)) return toast('❌ Nomor Induk / NISN sudah terdaftar!', 'error');

                await window.dataSdk.create({ type: 'student', nis, nisn, student_name: name, class_id: cls, created_at: new Date().toISOString() });
                toast('Siswa berhasil ditambah');
                modal.remove();
                renderCurrentPage();
            });
        }

        // --- FUNGSI FIX IMPORT EXCEL DINAMIS ---
        async function importSiswaFromFile() {
            const fileInput = document.getElementById('siswa-import-file');
            if (!fileInput.files.length) return;
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });
                    let success = 0;
                    let duplicates = 0;
                    
                    // Membaca semua sheet/tab di dalam file Excel (misal tab 8A, 8B, dsb)
                    for (let sheetName of workbook.SheetNames) {
                        const sheet = workbook.Sheets[sheetName];
                        // Ambil data dalam bentuk Array 2 Dimensi agar baris kosong/judul di atas aman terlewati
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        
                        let headerRowIndex = -1;
                        let colInduk = -1;
                        let colNisn = -1;
                        let colNama = -1;
                        let colKelas = -1;
                        
                        // 1. Pindai baris secara dinamis untuk menemukan baris Nama Kolom asli
                        for (let i = 0; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row) continue;
                            
                            for (let j = 0; j < row.length; j++) {
                                const val = String(row[j] || '').toUpperCase().trim();
                                if (val === 'INDUK' || val === 'NIS' || val === 'NO INDUK') colInduk = j;
                                if (val === 'NISN') colNisn = j;
                                if (val === 'NAMA SISWA' || val === 'NAMA') colNama = j;
                                if (val === 'KELAS') colKelas = j;
                            }
                            
                            // Jika kolom INDUK/NIS dan NAMA sudah ketemu, jadikan ini baris acuan header
                            if (colInduk !== -1 && colNama !== -1) {
                                headerRowIndex = i;
                                break;
                            }
                        }
                        
                        // Jika baris header tidak ditemukan di tab ini, lewati ke tab berikutnya
                        if (headerRowIndex === -1) continue;
                        
                        // 2. Baca baris data setelah index baris header tersebut
                        for (let i = headerRowIndex + 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row) continue;
                            
                            const induk = String(row[colInduk] || '').trim();
                            const nisn = colNisn !== -1 ? String(row[colNisn] || '').trim() : '';
                            const name = colNama !== -1 ? String(row[colNama] || '').trim() : '';
                            
                            // Jika kolom kelas tidak ada di dalam baris data, otomatis gunakan nama Sheet/Tab (misal: "8A")
                            let kelas = colKelas !== -1 ? String(row[colKelas] || '').trim() : '';
                            if (!kelas) {
                                kelas = sheetName;
                            }
                            
                            // Validasi data minimal: induk & nama tidak boleh kosong, dan bukan baris sub-header
                            if (!induk || !name || induk.toUpperCase() === 'INDUK' || name.toUpperCase() === 'NAMA SISWA') {
                                continue; 
                            }
                            
                            // Cek duplikasi sebelum menyimpan
                            if (!isDuplicateStudent(induk, nisn)) {
                                await window.dataSdk.create({ 
                                    type: 'student', 
                                    nis: induk, 
                                    nisn: nisn, 
                                    student_name: name, 
                                    class_id: kelas,
                                    created_at: new Date().toISOString()
                                });
                                success++;
                            } else {
                                duplicates++;
                            }
                        }
                    }
                    
                    toast(`🎉 Import Selesai: ${success} siswa baru disimpan. (${duplicates} data duplikat dilewati)`);
                    fileInput.value = ''; // Reset input file
                    renderCurrentPage();
                } catch (err) {
                    toast('Gagal memproses susunan berkas Excel!', 'error');
                    console.error(err);
                }
            };
            reader.readAsBinaryString(file);
        }

        async function deleteStudent(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data siswa ini?')) {
                await window.dataSdk.delete({ __backendId: id });
                toast('Data siswa berhasil dihapus');
                renderCurrentPage();
            }
        }

        // --- RENDER HALAMAN ---
        function renderCurrentPage(page) {
            if (page) currentPage = page;
            const main = document.getElementById('main-content');
            const nav = document.getElementById('sidebar-nav');
            
            // Render Navigasi Sidebar
            nav.innerHTML = `
                <button onclick="renderCurrentPage('dashboard')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${currentPage === 'dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'}">
                    Dashboard
                </button>
                <button onclick="renderCurrentPage('siswa')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${currentPage === 'siswa' ? 'bg-blue-600 text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'}">
                    Data Siswa
                </button>
                <button onclick="doLogout()" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-semibold text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition flex items-center gap-2 mt-auto">
                    Keluar Sesi
                </button>
            `;

            // Konten Halaman Dashboard
            if (currentPage === 'dashboard') {
                const totalSiswa = allData.filter(d => d.type === 'student').length;
                main.innerHTML = `
                    <div class="fade-in">
                        <h1 class="text-2xl font-bold mb-1 text-slate-900 dark:text-white">Dashboard Utama</h1>
                        <p class="text-sm text-slate-500 mb-6">Ringkasan data administrasi SMPN 1 Ngunut</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border dark:border-slate-700 shadow-sm">
                                <p class="text-sm font-medium text-slate-400">Total Terdata (Siswa)</p>
                                <h3 class="text-3xl font-extrabold text-slate-800 dark:text-white mt-1">${totalSiswa} Siswa</h3>
                            </div>
                        </div>
                    </div>
                `;
            } 
            // Konten Halaman Data Siswa
            else if (currentPage === 'siswa') {
                const students = allData.filter(d => d.type === 'student');
                main.innerHTML = `
                    <div class="fade-in">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                            <div>
                                <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Data Siswa</h1>
                                <p class="text-sm text-slate-500">Kelola nomor induk, NISN, dan rombongan belajar kelas.</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <label class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold cursor-pointer transition flex items-center gap-1.5">
                                    Import Excel
                                    <input type="file" id="siswa-import-file" class="hidden" accept=".xlsx, .xls" onchange="importSiswaFromFile()">
                                </label>
                                <button onclick="showAddStudentModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition">
                                    + Tambah Manual
                                </button>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 rounded-xl border dark:border-slate-700 shadow-sm overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm text-left">
                                    <thead class="bg-slate-50 dark:bg-slate-700/50 border-b dark:border-slate-700 text-slate-500 dark:text-slate-400">
                                        <tr>
                                            <th class="px-6 py-3 font-semibold">No</th>
                                            <th class="px-6 py-3 font-semibold">No. Induk</th>
                                            <th class="px-6 py-3 font-semibold">NISN</th>
                                            <th class="px-6 py-3 font-semibold">Nama Lengkap</th>
                                            <th class="px-6 py-3 font-semibold">Kelas</th>
                                            <th class="px-6 py-3 font-semibold text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y dark:divide-slate-700 text-slate-700 dark:text-slate-300">
                                        ${students.length === 0 ? `
                                            <tr>
                                                <td colspan="6" class="px-6 py-12 text-center text-slate-400">Belum ada data siswa. Silakan klik tombol Import Excel atau Tambah Manual.</td>
                                            </tr>
                                        ` : students.map((s, idx) => `
                                            <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/20">
                                                <td class="px-6 py-3.5 text-slate-400 font-medium">${idx + 1}</td>
                                                <td class="px-6 py-3.5 font-mono text-xs font-semibold">${s.nis || '-'}</td>
                                                <td class="px-6 py-3.5 font-mono text-xs text-slate-500">${s.nisn || '-'}</td>
                                                <td class="px-6 py-3.5 font-bold">${s.student_name}</td>
                                                <td class="px-6 py-3.5"><span class="px-2.5 py-0.5 bg-slate-100 dark:bg-slate-700 text-xs font-medium rounded-md">${s.class_id || '-'}</span></td>
                                                <td class="px-6 py-3.5 text-center">
                                                    <button onclick="deleteStudent('${s.__backendId}')" class="px-3 py-1 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-600 hover:text-white dark:hover:bg-red-600 rounded-lg text-xs font-semibold transition">Hapus</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // --- TOAST NOTIFICATION ---
        function toast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `toast px-4 py-3 rounded-lg text-white text-sm font-semibold shadow-md ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`;
            el.textContent = msg;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // --- AUTHENTICATION ---
        async function doLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            
            if (email === 'admin@gmail.com' && pass === 'admin123') {
                currentUser = { name: 'Super Admin', email: 'admin@gmail.com', role: 'admin' };
                document.getElementById('page-login').classList.add('hidden');
                document.getElementById('page-app').classList.remove('hidden');
                renderCurrentPage('dashboard');
                toast('Selamat datang kembali!');
            } else {
                toast('Kombinasi email & password salah!', 'error');
            }
        }

        function doLogout() {
            currentUser = null;
            document.getElementById('page-app').classList.add('hidden');
            document.getElementById('page-login').classList.remove('hidden');
            document.getElementById('login-pass').value = '';
            toast('Berhasil keluar sesi');
        }

        // --- INITIALIZATION ---
        async function initApp() {
            window.dataSdk = createLocalDataSdk();
            await window.dataSdk.init({ onDataChanged: (d) => { allData = d; if(currentUser) renderCurrentPage(); } });
        }

        initApp();
    </script>
</body>
</html>
