<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Guru - SMPN 1 Ngunut</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; } }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <div id="app" class="h-full w-full overflow-auto">
        <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>
        
        <div id="page-login" class="h-full w-full flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 fade-in">
                <h1 class="text-xl font-bold text-center mb-6">SMP Negeri 1 Ngunut</h1>
                <div id="login-form">
                    <input id="login-email" type="email" class="w-full mb-4 px-4 py-2.5 rounded-lg border dark:border-slate-600 dark:bg-slate-700 text-sm focus:outline-none focus:border-blue-500" placeholder="Email (admin@gmail.com)">
                    <input id="login-pass" type="password" class="w-full mb-4 px-4 py-2.5 rounded-lg border dark:border-slate-600 dark:bg-slate-700 text-sm focus:outline-none focus:border-blue-500" placeholder="Password (admin123)">
                    <button onclick="doLogin()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm transition">Masuk</button>
                </div>
            </div>
        </div>

        <div id="page-app" class="hidden h-full w-full flex">
            <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r dark:border-slate-700 flex flex-col h-full shrink-0">
                <div class="p-4 border-b dark:border-slate-700">
                    <h2 class="font-bold text-lg">Admin Panel</h2>
                    <p class="text-sm text-slate-500" id="user-display-name">Loading...</p>
                </div>
                <nav class="flex-1 p-3 space-y-1" id="sidebar-nav">
                    <button onclick="renderCurrentPage('dashboard')" class="w-full text-left px-4 py-2 rounded-lg bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-white font-medium text-sm">Dashboard</button>
                    <button onclick="renderCurrentPage('siswa')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium text-sm">Data Siswa</button>
                    <button onclick="doLogout()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-red-600 font-medium text-sm mt-auto">Keluar</button>
                </nav>
            </aside>

            <main class="flex-1 overflow-y-auto h-full p-6" id="main-content">
                </main>
        </div>
    </div>

    <script>
        // --- SDK & STATE ---
        let allData = [];
        let currentUser = null;
        let currentPage = 'dashboard';

        function createLocalDataSdk() {
            const storageKey = 'sistem_admin_guru_v2';
            return {
                async init(handler) { 
                    allData = JSON.parse(localStorage.getItem(storageKey) || '[]'); 
                    handler.onDataChanged(allData); 
                    return { isOk: true }; 
                },
                async create(r) { 
                    r.__backendId = 'id_' + Date.now(); 
                    allData.push(r); 
                    localStorage.setItem(storageKey, JSON.stringify(allData)); 
                    return { isOk: true }; 
                },
                async update(r) { 
                    const idx = allData.findIndex(i => i.__backendId === r.__backendId); 
                    if(idx !== -1) {
                        allData[idx] = r; 
                        localStorage.setItem(storageKey, JSON.stringify(allData)); 
                    }
                    return { isOk: true }; 
                },
                async delete(r) { 
                    allData = allData.filter(i => i.__backendId !== r.__backendId); 
                    localStorage.setItem(storageKey, JSON.stringify(allData)); 
                    return { isOk: true }; 
                }
            };
        }

        // --- VALIDASI PRIMARY KEY ---
        function isDuplicateStudent(nis, nisn, excludeId = null) {
            if (!nis && !nisn) return false;
            return allData.filter(d => d.type === 'student').some(s => {
                if (excludeId && s.__backendId === excludeId) return false;
                const sameNis = nis && String(s.nis || '').trim() === String(nis).trim();
                const sameNisn = nisn && String(s.nisn || '').trim() === String(nisn).trim();
                return sameNis || sameNisn;
            });
        }

        // --- MODAL POPUP HELPER ---
        function openModal(title, inputsHtml, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 fade-in';
            overlay.innerHTML = `
            <div class="bg-white dark:bg-slate-800 rounded-xl p-6 w-full max-w-md mx-4 shadow-xl">
                <h3 class="font-bold text-lg mb-4 text-slate-800 dark:text-white">${title}</h3>
                <div class="mb-6 space-y-3">${inputsHtml}</div>
                <div class="flex gap-2 justify-end">
                    <button onclick="this.parentElement.parentElement.parentElement.remove()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-sm font-medium transition">Batal</button>
                    <button id="conf-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">Simpan</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#conf-btn').onclick = () => { onConfirm(overlay); };
        }

        // --- FUNGSI LOGIKA SISWA (SAVE/IMPORT) ---
        function showAddStudentModal() {
            const inputs = `
                <input id="inp-nis" type="text" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 text-sm" placeholder="NIS">
                <input id="inp-nisn" type="text" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 text-sm" placeholder="NISN">
                <input id="inp-sname" type="text" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 text-sm" placeholder="Nama Lengkap Siswa">
                <input id="inp-sclass" type="text" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 text-sm" placeholder="Kelas (contoh: VII A)">
            `;
            openModal('Tambah Data Siswa', inputs, async (modal) => {
                const nis = document.getElementById('inp-nis').value.trim();
                const nisn = document.getElementById('inp-nisn').value.trim();
                const name = document.getElementById('inp-sname').value.trim();
                const cls = document.getElementById('inp-sclass').value.trim();
                
                if (!nis || !name || !cls) return toast('NIS, Nama, dan Kelas wajib diisi!', 'error');
                if (isDuplicateStudent(nis, nisn)) return toast('❌ NIS atau NISN sudah terdaftar!', 'error');

                await window.dataSdk.create({ 
                    type: 'student', 
                    nis, 
                    nisn, 
                    student_name: name, 
                    class_id: cls, 
                    created_at: new Date().toISOString() 
                });
                
                toast('Siswa berhasil ditambah');
                modal.remove();
                renderCurrentPage('siswa');
            });
        }

        async function importSiswaFromFile() {
            const fileInput = document.getElementById('siswa-import-file');
            if (!fileInput.files.length) return toast('Pilih file Excel terlebih dahulu', 'error');
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                try {
                    const data = XLSX.utils.sheet_to_json(XLSX.read(e.target.result, { type: 'binary' }).Sheets[0]);
                    let success = 0;
                    let duplicates = 0;
                    
                    for(let row of data) {
                        const nis = String(row['NIS'] || row['INDUK'] || '').trim();
                        const nisn = String(row['NISN'] || '').trim();
                        const name = String(row['NAMA'] || row['NAMA SISWA'] || '').trim();
                        const cls = String(row['KELAS'] || '').trim();

                        if(nis && name) {
                            if (!isDuplicateStudent(nis, nisn)) {
                                await window.dataSdk.create({ type: 'student', nis, nisn, student_name: name, class_id: cls });
                                success++;
                            } else {
                                duplicates++;
                            }
                        }
                    }
                    toast(`Import selesai: ${success} berhasil disimpan, ${duplicates} duplikat dilewati.`);
                    renderCurrentPage('siswa');
                } catch (err) {
                    toast('Terjadi kesalahan saat memproses file.', 'error');
                    console.error(err);
                }
            };
            reader.readAsBinaryString(file);
        }

        // --- RENDER HALAMAN ---
        function renderCurrentPage(page) {
            if(page) currentPage = page;
            const main = document.getElementById('main-content');
            
            if (currentPage === 'dashboard') {
                const totalSiswa = allData.filter(d => d.type === 'student').length;
                main.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Dashboard</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-blue-600 text-white p-6 rounded-xl shadow">
                            <h3 class="text-blue-100 font-medium">Total Siswa</h3>
                            <p class="text-3xl font-bold mt-2">${totalSiswa}</p>
                        </div>
                    </div>
                `;
            } 
            else if (currentPage === 'siswa') {
                const students = allData.filter(d => d.type === 'student');
                main.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h2 class="text-2xl font-bold">Data Siswa</h2>
                        <div class="flex gap-2">
                            <label class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium cursor-pointer hover:bg-emerald-700 transition">
                                <i data-lucide="upload" class="w-4 h-4 inline mr-1"></i> Import Excel
                                <input type="file" id="siswa-import-file" class="hidden" accept=".xlsx, .xls" onchange="importSiswaFromFile()">
                            </label>
                            <button onclick="showAddStudentModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                                + Tambah Siswa
                            </button>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow overflow-hidden">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-100 dark:bg-slate-700/50">
                                <tr>
                                    <th class="px-6 py-3 font-semibold">NIS / NISN</th>
                                    <th class="px-6 py-3 font-semibold">Nama Siswa</th>
                                    <th class="px-6 py-3 font-semibold">Kelas</th>
                                    <th class="px-6 py-3 font-semibold text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${students.length === 0 ? `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Belum ada data siswa</td></tr>` : 
                                students.map(s => `
                                    <tr class="border-t dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/30">
                                        <td class="px-6 py-4">
                                            <div class="font-medium">${s.nis || '-'}</div>
                                            <div class="text-xs text-slate-500">${s.nisn || '-'}</div>
                                        </td>
                                        <td class="px-6 py-4 font-medium">${s.student_name}</td>
                                        <td class="px-6 py-4">${s.class_id || '-'}</td>
                                        <td class="px-6 py-4 text-right">
                                            <button onclick="deleteStudent('${s.__backendId}')" class="text-red-500 hover:text-red-700 text-xs font-medium bg-red-50 dark:bg-red-900/30 px-2 py-1 rounded">Hapus</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
            
            // Re-inisialisasi icon lucide setiap kali render ulang DOM
            if(window.lucide) window.lucide.createIcons();
        }

        async function deleteStudent(id) {
            if(confirm('Yakin ingin menghapus siswa ini?')) {
                await window.dataSdk.delete({ __backendId: id });
                toast('Siswa dihapus');
                renderCurrentPage('siswa');
            }
        }

        // --- INITIALIZATION ---
        function toast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `toast px-4 py-3 rounded-lg text-white text-sm font-medium shadow-lg flex items-center ${type==='error'?'bg-red-500':'bg-emerald-500'}`;
            el.innerHTML = msg;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // --- AUTH & NAVIGATION ---
        async function doLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            
            // Simulasi Login (Pastikan admin pertama dibuat otomatis di sini)
            if (email === 'admin@gmail.com' && pass === 'admin123') {
                currentUser = { name: 'Super Admin', email: 'admin@gmail.com', role: 'admin' };
                document.getElementById('user-display-name').textContent = currentUser.name;
                
                document.getElementById('page-login').classList.add('hidden');
                document.getElementById('page-app').classList.remove('hidden');
                
                renderCurrentPage('dashboard');
                toast('Berhasil login!');
            } else {
                toast('Login gagal. Periksa kembali Email & Password.', 'error');
            }
        }

        function doLogout() {
            currentUser = null;
            document.getElementById('page-app').classList.add('hidden');
            document.getElementById('page-login').classList.remove('hidden');
            document.getElementById('login-pass').value = '';
        }

        async function initApp() {
            window.dataSdk = createLocalDataSdk();
            await window.dataSdk.init({ 
                onDataChanged: (d) => { 
                    allData = d; 
                    if(currentUser) renderCurrentPage(); 
                } 
            });
            if(window.lucide) window.lucide.createIcons();
        }

        // Jalankan init app saat script dimuat
        initApp();
    </script>
</body>
</html>
